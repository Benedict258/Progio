services:
  db:
    image: pgvector/pgvector:pg16
    container_name: progio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: progio
      POSTGRES_PASSWORD: progio_secret
      POSTGRES_DB: progio
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progio -d progio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
